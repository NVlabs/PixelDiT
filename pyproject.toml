[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pixdit-core"
version = "0.1.0"
description = "PixelDiT and PixelDiT2 model definitions (pixel-space diffusion transformers)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Only what the model definitions import. Training, sampling and evaluation scripts (c2i/, t2i/, tools/)
# are not part of the package; they keep using requirements-pixeldit1.txt / requirements-pixeldit2.txt.
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
# PixelDiT2's grounding encoder (pixdit_core.grounding) creates its DINOv3 backbone with timm.
pixeldit2 = ["timm"]

[project.urls]
Homepage = "https://github.com/NVlabs/PixelDiT"

[tool.setuptools]
packages = ["pixdit_core"]
